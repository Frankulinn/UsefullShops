# UsefullShops configuration

# Chat prefix (MiniMessage)
prefix: "<white>[<gold>Shops<white>] "

# Language of the messages: fr | en (files messages_<lang>.yml are copied next to this file and can be edited)
language: fr

# Ask for a confirmation (Yes/No screen) before buying
confirm-purchase: true

# Close the menu after a successful purchase (otherwise the shop stays open)
close-on-purchase: false

# Prefix of the permissions generated by /us restrict <shop>
permission-prefix: "usefullshops.shop."

# Seconds during which /us npc add waits for a click on a NPC
npc-selection-timeout: 30

history:
  # Number of latest transactions kept (and shown by /us history)
  size: 100
  # Also append every purchase to plugins/UsefullShops/logs/purchases.log
  log-to-file: false
